services:
  database:
    image: postgres:15
    container_name: expense_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: expenses_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: expense_backend
    restart: always
    depends_on:
      - database
    environment:
      DB_HOST: database
    ports:
      - "3000:3000"

volumes:
  db_data: